<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sin conexión · Pegazo</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #fff7ed;
        color: #7c2d12;
        text-align: center;
        padding: 24px;
      }
      img { width: 84px; height: 84px; border-radius: 18px; }
      h1 { font-size: 20px; margin: 6px 0 0; color: #9a3412; }
      p { font-size: 14px; color: #b45309; max-width: 320px; margin: 0; }
      button {
        margin-top: 8px;
        border: 0;
        background: #ea580c;
        color: #fff;
        font-weight: 600;
        font-size: 14px;
        padding: 10px 18px;
        border-radius: 10px;
      }
    </style>
  </head>
  <body>
    <img src="/icons/icon-192.png" alt="Pegazo" />
    <h1>Sin conexión</h1>
    <p>No hay internet en este momento. Revisa tu conexión y vuelve a intentarlo.</p>
    <button onclick="location.reload()">Reintentar</button>
  </body>
</html>
